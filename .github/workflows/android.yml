name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate signing keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APKs (debug + release)
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/
          cp app/build/outputs/apk/release/*.apk dist/
          ls -la dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Marpeleh-APKs
          path: dist/*.apk
          retention-days: 90

      - name: Create GitHub Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0 >/dev/null 2>&1; then
            gh release upload v1.0 dist/*.apk --clobber
          else
            gh release create v1.0 dist/*.apk \
              --title "مار و پله — نسخه ۱.۰" \
              --latest \
              --notes "🎮 بازی مار و پله برای اندروید

          📲 نصب: فایل Marpeleh-release.apk را دانلود و اجرا کنید (نصب از منابع ناشناس را فعال کنید).

          🛠 ساخته‌شده به‌صورت خودکار با GitHub Actions

          👤 سازنده: دانیال افشاری | تلگرام: [سهند سافت](https://t.me/sahandsoft)"
          fi
