plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sahandsoft.marpeleh'
    compileSdk 34

    defaultConfig {
        applicationId "com.sahandsoft.marpeleh"
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName "1.5"
    }

    // خروجی release با کلید debug امضا می‌شود تا APK قابل نصب باشد
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "Marpeleh-${variant.name}.apk"
        }
    }
}
